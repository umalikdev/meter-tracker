name: Deploy Meter Tracker to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish MeterTracker/MeterTracker.csproj -c Release -o release

      - name: Set base href to repo name
        run: |
          sed -i 's|<base href="/REPO_NAME/" />|<base href="/${{ github.event.repository.name }}/" />|' release/wwwroot/index.html

      - name: Add .nojekyll (so _framework files aren't ignored)
        run: touch release/wwwroot/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
